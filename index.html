    <style>
        /* ===== GLOBAL DESIGN TOKENS ===== */
        :root {
            --bg: #f0f5f8; --surface: #ffffff; --surface2: #f8fafb;
            --text: #1a2e2b; --text2: #4a5b58; --border: #e2e8f0;
            --accent: #0d9488; --accent2: #14b8a6; --accent3: #5eead4;
            --danger: #ef4444; --warning: #f59e0b; --success: #10b981;
            --info: #3b82f6; --shadow: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.1);
            --glass: rgba(255,255,255,0.85); --glass-border: rgba(255,255,255,0.5);
            --radius: 1.2rem; --radius-sm: 0.8rem; --radius-xs: 0.5rem;
            --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
            --glow: 0 0 30px rgba(20,184,166,0.3);
            --navbar-h: 64px;

            /* Lock screen specific */
            --lock-bg: #f0f5f8; --lock-surface: #ffffff; --lock-key-bg: #ffffff;
            --lock-key-bg-pressed: #0d9488;
            --lock-key-shadow: 0 4px 16px rgba(13,148,136,0.15), 0 1px 4px rgba(0,0,0,0.08);
            --lock-dot-empty: #d1dde0; --lock-dot-filled: #0d9488;
            --lock-display-bg: rgba(13,148,136,0.08); --lock-display-border: rgba(13,148,136,0.25);
            --lock-text: #1a2e2b; --lock-text2: #4a5b58;
        }

        [data-theme="dark"] {
            --bg: #0f1a1a; --surface: #152622; --surface2: #1a2e2a;
            --text: #e0f0ec; --text2: #a0b8b2; --border: #2a403a;
            --accent: #2dd4bf; --accent2: #5eead4; --accent3: #99f6e4;
            --shadow: 0 2px 8px rgba(0,0,0,0.3); --shadow-lg: 0 12px 32px rgba(0,0,0,0.4);
            --glass: rgba(21,38,34,0.88); --glass-border: rgba(45,212,191,0.25);
            --glow: 0 0 40px rgba(45,212,191,0.5);

            --lock-bg: #0f1a1a; --lock-surface: #152622; --lock-key-bg: #1a2e2a;
            --lock-key-bg-pressed: #2dd4bf;
            --lock-key-shadow: 0 4px 16px rgba(0,0,0,0.4), 0 1px 4px rgba(45,212,191,0.12);
            --lock-dot-empty: #2a403a; --lock-dot-filled: #2dd4bf;
            --lock-display-bg: rgba(45,212,191,0.08); --lock-display-border: rgba(45,212,191,0.3);
            --lock-text: #e0f0ec; --lock-text2: #a0b8b2;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: auto; font-size: 15px; }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh; overflow-x: hidden; line-height: 1.5;
        }

        /* ===== LOCKSCREEN ===== */
        #lockScreen {
            position: fixed; inset: 0; z-index: 9000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--lock-bg);
            transition: opacity 0.5s cubic-bezier(0.4,0,0.2,1), transform 0.5s cubic-bezier(0.4,0,0.2,1);
            will-change: opacity, transform; padding: 2rem 1rem; gap: 0;
            touch-action: manipulation;   /* prevent double‑tap zoom */
        }
        #lockScreen::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(13,148,136,0.07) 0%, transparent 70%),
                        radial-gradient(ellipse 40% 30% at 80% 100%, rgba(20,184,166,0.05) 0%, transparent 60%);
            pointer-events: none;
        }
        [data-theme="dark"] #lockScreen::before {
            background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(45,212,191,0.1) 0%, transparent 70%),
                        radial-gradient(ellipse 40% 30% at 80% 100%, rgba(45,212,191,0.06) 0%, transparent 60%);
        }
        #lockScreen.unlocking { opacity: 0; transform: scale(1.04); pointer-events: none; }

        .lock-inner {
            position: relative; display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 340px; gap: 0;
        }

        .passcode-display-wrap { width: 100%; margin-bottom: 1.6rem; animation: lockFadeIn 0.6s 0.1s ease both; }
        .passcode-label {
            font-size: 0.7rem; font-weight: 600; color: var(--lock-text2); text-align: center;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem;
        }
        .passcode-display {
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            background: var(--lock-display-bg); border: 1.5px solid var(--lock-display-border);
            border-radius: 14px; padding: 0.65rem 1.2rem;
            font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
            font-size: 1.6rem; font-weight: 700; letter-spacing: 0.35rem;
            color: var(--accent); text-align: center; user-select: none; backdrop-filter: blur(8px);
        }
        [data-theme="dark"] .passcode-display { color: var(--accent2); }

        .dots-row {
            display: flex; align-items: center; justify-content: center; gap: 1.4rem;
            margin-bottom: 2rem; height: 36px; animation: lockFadeIn 0.6s 0.15s ease both;
        }
        .lock-dot {
            width: 14px; height: 14px; border-radius: 50%; background: var(--lock-dot-empty);
            border: 2px solid transparent; transition: background 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
            flex-shrink: 0;
        }
        .lock-dot.filled {
            background: var(--lock-dot-filled); border-color: var(--lock-dot-filled);
            transform: scale(1.18); box-shadow: 0 0 8px rgba(13,148,136,0.4);
        }
        [data-theme="dark"] .lock-dot.filled { box-shadow: 0 0 10px rgba(45,212,191,0.5); }
        @keyframes dotShake {
            0%, 100% { transform: translateX(0); }
            12%       { transform: translateX(-7px); }
            36%       { transform: translateX(7px); }
            60%       { transform: translateX(-5px); }
            80%       { transform: translateX(4px); }
        }
        .dots-row.shake { animation: dotShake 0.45s ease; }

        .keypad-grid {
            display: grid; grid-template-columns: repeat(3, 82px); grid-template-rows: repeat(3, 82px);
            gap: 1rem; justify-content: center; animation: lockFadeIn 0.6s 0.2s ease both;
        }
        .key-btn {
            width: 82px; height: 82px; border-radius: 50%; border: none;
            background: var(--lock-key-bg); color: var(--lock-text);
            font-family: 'Inter', sans-serif; font-size: 1.7rem; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--lock-key-shadow);
            transition: background 0.12s ease, color 0.12s ease, transform 0.12s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.12s ease;
            -webkit-tap-highlight-color: transparent; user-select: none;
            position: relative; overflow: hidden; touch-action: manipulation;
        }
        .key-btn::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: radial-gradient(circle at 38% 38%, rgba(255,255,255,0.18) 0%, transparent 60%);
            pointer-events: none;
        }
        .key-btn:hover { background: var(--surface2); box-shadow: 0 6px 20px rgba(13,148,136,0.2), 0 1px 4px rgba(0,0,0,0.1); }
        [data-theme="dark"] .key-btn:hover { background: #223830; box-shadow: 0 6px 20px rgba(45,212,191,0.25), 0 1px 4px rgba(0,0,0,0.3); }
        .key-btn.pressed, .key-btn:active {
            background: var(--lock-key-bg-pressed) !important; color: #fff !important;
            transform: scale(0.91); box-shadow: 0 2px 8px rgba(13,148,136,0.2) !important;
        }
        [data-theme="dark"] .key-btn.pressed, [data-theme="dark"] .key-btn:active {
            box-shadow: 0 2px 8px rgba(45,212,191,0.25) !important;
        }

        .key-btn.key-back { font-size: 1.2rem; color: var(--lock-text2); background: transparent; box-shadow: none; }
        .key-btn.key-back:hover { background: var(--lock-display-bg); box-shadow: none; }
        .key-btn.key-back.pressed, .key-btn.key-back:active {
            background: var(--lock-display-bg) !important; color: var(--accent) !important; box-shadow: none !important;
        }

        .lock-error {
            font-size: 0.8rem; color: var(--danger); text-align: center;
            height: 1.2rem; margin-top: 1rem; font-weight: 500;
            opacity: 0; transition: opacity 0.2s ease;
        }
        .lock-error.visible { opacity: 1; }

        @keyframes unlockPulse {
            0%   { box-shadow: 0 0 0 0 rgba(16,185,129,0.6); }
            70%  { box-shadow: 0 0 0 20px rgba(16,185,129,0); }
            100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
        }
        .lock-dot.success {
            background: var(--success) !important; border-color: var(--success) !important;
            animation: unlockPulse 0.6s ease;
        }
        @keyframes lockFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== APP CONTAINER ===== */
        #appContainer { display: none; width: 100%; min-height: 100vh; opacity: 0; transition: opacity 0.4s ease 0.1s; }
        #appContainer.visible { display: flex; opacity: 1; }

<body>
    <!-- ===== LOCKSCREEN (no branding) ===== -->
    <div id="lockScreen" role="main" aria-label="Passcode Lock Screen">
        <div class="lock-inner">
            <div class="passcode-display-wrap">
                <div class="passcode-label">Enter this passcode</div>
                <div class="passcode-display" id="passcodeDisplay" aria-live="polite">— — — — —</div>
            </div>

            <div class="dots-row" id="dotsRow" aria-label="Passcode progress">
                <div class="lock-dot" id="dot0" aria-hidden="true"></div>
                <div class="lock-dot" id="dot1" aria-hidden="true"></div>
                <div class="lock-dot" id="dot2" aria-hidden="true"></div>

            </div>

            <div class="keypad-grid" role="group" aria-label="Numeric keypad">
                <button class="key-btn" data-key="1" aria-label="1">1</button>
                <button class="key-btn" data-key="2" aria-label="2">2</button>
                <button class="key-btn" data-key="3" aria-label="3">3</button>
                <button class="key-btn" data-key="4" aria-label="4">4</button>
                <button class="key-btn" data-key="5" aria-label="5">5</button>
                <button class="key-btn" data-key="6" aria-label="6">6</button>
                <button class="key-btn" data-key="7" aria-label="7">7</button>
                <button class="key-btn" data-key="8" aria-label="8">8</button>
                <button class="key-btn" data-key="9" aria-label="9">9</button>
            </div>

            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1rem;width:100%;max-width:calc(3*82px + 2*1rem);justify-items:center;">
                <div></div>
                <div></div>
                <button class="key-btn key-back" id="backspaceBtn" aria-label="Delete last digit">
                    <i class="fas fa-delete-left"></i>
                </button>
            </div>
            <div class="lock-error" id="lockError" aria-live="assertive">Incorrect passcode — try again</div>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div id="appContainer">

    <!-- Firebase & Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <script>
    (function () {
        'use strict';

        /* ========================
           THEME — apply saved theme immediately
        ======================== */
        const savedTheme = localStorage.getItem('reliefos_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        /* ========================
           LOCK SCREEN LOGIC
        ======================== */
        const lockScreen    = document.getElementById('lockScreen');
        const appContainer  = document.getElementById('appContainer');
        const passcodeDisp  = document.getElementById('passcodeDisplay');
        const dotsRow       = document.getElementById('dotsRow');
        const lockError     = document.getElementById('lockError');
        const dots          = [0,1,2,3,4].map(i => document.getElementById('dot' + i));
        const backspaceBtn  = document.getElementById('backspaceBtn');

        // Generate random 5‑digit passcode (digits 1‑9 only)
        const correctPasscode = Array.from({ length: 5 }, () =>
            String(Math.floor(Math.random() * 9) + 1)
        ).join('');
        passcodeDisp.textContent = correctPasscode.split('').join('  ');

        let entered = '';
        let lockBusy = false;

        function updateDots() {
            dots.forEach((dot, i) => {
                if (i < entered.length) dot.classList.add('filled');
                else dot.classList.remove('filled');
            });
        }

        function showLockError() { lockError.classList.add('visible'); }
        function hideLockError() { lockError.classList.remove('visible'); }

        function shakeAndClear() {
            lockBusy = true;
            dotsRow.classList.remove('shake');
            void dotsRow.offsetWidth;  // force reflow
            dotsRow.classList.add('shake');
            showLockError();
            setTimeout(() => {
                entered = '';
                updateDots();
                dotsRow.classList.remove('shake');
                lockBusy = false;
            }, 480);
        }

        function unlockApp() {
            lockBusy = true;
            hideLockError();
            dots.forEach(d => { d.classList.remove('filled'); d.classList.add('filled', 'success'); });
            setTimeout(() => {
                lockScreen.classList.add('unlocking');
                appContainer.style.display = 'flex';
                appContainer.style.flexDirection = 'column';
                requestAnimationFrame(() => requestAnimationFrame(() => appContainer.classList.add('visible')));
                setTimeout(() => {
                    lockScreen.style.display = 'none';
                    lockBusy = false;
                    if (!window._appInitialized) { window._appInitialized = true; initApp(); }
                }, 520);
            }, 320);
        }

        function handleDigit(digit) {
            if (lockBusy) return;
            if (entered.length >= 5) return;
            hideLockError();
            entered += digit;
            updateDots();
            if (entered.length === 5) {
                if (entered === correctPasscode) unlockApp();
                else shakeAndClear();
            }
        }

        function handleBackspace() {
            if (lockBusy) return;
            if (entered.length === 0) return;
            hideLockError();
            entered = entered.slice(0, -1);
            updateDots();
        }

        // --- FIX: pointer events only – no duplicate touch listeners ---
        document.querySelectorAll('.key-btn[data-key]').forEach(btn => {
            const digit = btn.dataset.key;
            function onPress(e) {
                e.preventDefault();
                btn.classList.add('pressed');
                handleDigit(digit);
            }
            function onRelease() { btn.classList.remove('pressed'); }

            btn.addEventListener('pointerdown', onPress, { passive: false });
            btn.addEventListener('pointerup', onRelease);
            btn.addEventListener('pointercancel', onRelease);
        });

        backspaceBtn.addEventListener('pointerdown', e => {
            e.preventDefault();
            backspaceBtn.classList.add('pressed');
            handleBackspace();
        });
        backspaceBtn.addEventListener('pointerup', () => backspaceBtn.classList.remove('pressed'));
        backspaceBtn.addEventListener('pointercancel', () => backspaceBtn.classList.remove('pressed'));

        let clearTimer;
        backspaceBtn.addEventListener('pointerdown', () => {
            clearTimer = setTimeout(() => {
                entered = '';
                updateDots();
                hideLockError();
            }, 600);
        });
        backspaceBtn.addEventListener('pointerup', () => clearTimeout(clearTimer));

        document.addEventListener('keydown', e => {
            if (lockScreen.style.display === 'none') return;
            if (e.key >= '1' && e.key <= '9') { e.preventDefault(); handleDigit(e.key); }
            else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); handleBackspace(); }
        });

        /* ========================
           APP INIT (identical to your last working version)
        ======================== */
        function initApp() {
            // Firebase
            const firebaseConfig = {
                apiKey: "AIzaSyAhlOE9REfvPUaOeHZEsOEpkcPXpPenp94",
                authDomain: "reliefos-1b4b5.firebaseapp.com",
                projectId: "reliefos-1b4b5",
                storageBucket: "reliefos-1b4b5.firebasestorage.app",
                messagingSenderId: "638272932158",
                appId: "1:638272932158:web:b8303ab3c7b90b9ccbc46f"
            };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            const tasksRef = db.collection("tasks");
            const volunteersRef = db.collection("volunteers");

            let map, markerCluster, chartInstance;
            let matchCount = parseInt(localStorage.getItem('reliefos_matchCount') || '0');
            let tasksData = [], volsData = [];
            let locationCache = {};
            let mapUpdateTimer = null;
            let emergencyActive = false;
            let demoActive = false;
            let firebaseUnsubscribes = [];
            let taskFilterMinUrgency = 0;
            let volFilterAvailOnly = false;
            const geminiApiKey = "AIzaSyBZnDVLyzqtK-5I8D2zKGuRdasaNKcAnNw";

            const escapeHtml = s => {
                if (!s) return '';
                return String(s).replace(/[&<>"']/g, c =>
                    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]
                );
            };
            const showToast = (msg, icon = 'info-circle') => {
                const t = document.createElement('div');
                t.className = 'toast';
                t.innerHTML = `<i class="fas fa-${icon}"></i> ${escapeHtml(String(msg))}`;
                document.getElementById('toastContainer').appendChild(t);
                setTimeout(() => t.remove(), 2400);
            };

            // ... (the rest of initApp is exactly as before: map, chart, render, gemini, etc.)
            // Due to space constraints, I cannot paste the entire 1000+ lines here,
            // but you simply keep your existing initApp code unchanged.
        }

    })();
    </script>
